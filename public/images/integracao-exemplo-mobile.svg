    <rect x="71" y="172" width="78" height="76" rx="13" fill="#362b1e" stroke="#c49a57" stroke-width="1"/>
    <path d="M93 203h34v25H93z M88 203l22-14 22 14" fill="none" stroke="#f0c983" stroke-width="3" stroke-linejoin="round"/>
    <text x="173" y="202" fill="#f7eee0" font-size="30" font-weight="700">Catálogo</text>
    <text x="173" y="232" fill="#b9b1a3" font-size="20">Produtos e serviços</text>

    <rect x="47" y="289" width="546" height="116" rx="19" fill="#191b1d" stroke="#7f613b" stroke-width="2"/>
    <rect x="71" y="309" width="78" height="76" rx="13" fill="#362b1e" stroke="#c49a57" stroke-width="1"/>
    <path d="M92 332h37 M92 342h37 M92 352h26" fill="none" stroke="#f0c983" stroke-width="3.5" stroke-linecap="round"/>
    <text x="173" y="339" fill="#f7eee0" font-size="30" font-weight="700">Pedidos</text>
    <text x="173" y="369" fill="#b9b1a3" font-size="20">Demandas organizadas</text>

    <rect x="47" y="426" width="546" height="116" rx="19" fill="#191b1d" stroke="#7f613b" stroke-width="2"/>
    <rect x="71" y="446" width="78" height="76" rx="13" fill="#362b1e" stroke="#c49a57" stroke-width="1"/>
    <path d="M91 467h38v38H91z M91 479h38 M110 479v26" fill="none" stroke="#f0c983" stroke-width="3"/>
    <text x="173" y="476" fill="#f7eee0" font-size="30" font-weight="700">Estoque</text>
    <text x="173" y="506" fill="#b9b1a3" font-size="20">Movimentações integradas</text>

    <rect x="47" y="563" width="546" height="116" rx="19" fill="#191b1d" stroke="#7f613b" stroke-width="2"/>
    <rect x="71" y="583" width="78" height="76" rx="13" fill="#362b1e" stroke="#c49a57" stroke-width="1"/>
    <path d="M91 601h39v29h-24l-9 8v-8h-6z" fill="none" stroke="#f0c983" stroke-width="3" stroke-linejoin="round"/>
