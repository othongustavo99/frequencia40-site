<svg xmlns="http://www.w3.org/2000/svg" width="640" height="780" viewBox="0 0 640 780" role="img" aria-labelledby="title description">
  <title id="title">Exemplo de integração entre sistemas da empresa</title>
  <desc id="description">Quatro áreas conectadas: catálogo, pedidos, estoque e atendimento. Demonstração conceitual com identidade preta e dourada da Frequência40.</desc>
  <defs>
    <radialGradient id="bg" cx=".55" cy=".42" r=".85">
      <stop stop-color="#332718"/><stop offset=".68" stop-color="#151618"/><stop offset="1" stop-color="#090a0b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffe0a0"/><stop offset=".55" stop-color="#c99850"/><stop offset="1" stop-color="#a8722c"/>
    </linearGradient>
  </defs>
  <rect width="640" height="780" rx="26" fill="url(#bg)"/>
  <circle cx="536" cy="-36" r="300" fill="none" stroke="#c0944a" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="536" cy="-36" r="236" fill="none" stroke="#c0944a" stroke-opacity=".10" stroke-width="2"/>
  <text x="320" y="73" fill="#eac789" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="3">SISTEMAS CONECTADOS</text>
  <text x="320" y="115" fill="#f7eee0" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">Cada informação no seu lugar.</text>

  <path d="M320 164V686" stroke="url(#gold)" stroke-width="3" stroke-dasharray="7 9" opacity=".56"/>
  <g font-family="Arial,sans-serif">
